<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapports RH - CV Analyzer Pro</title>
    <link rel="stylesheet" href="/static/hr-dashboard/hr-reports.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="grid-overlay"></div>
    </div>

    <div class="reports-container">
        <!-- Header -->
        <div class="reports-header">
            <div class="header-content">
                <div class="reports-title">
                    <i class="fas fa-chart-bar"></i>
                    <h1>Rapports RH</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-back" onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                        Retour
                    </button>

                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="reports-grid">
            <!-- Statistiques générales -->
            <div class="report-section">
                <h2 class="section-title">
                    <i class="fas fa-chart-line"></i>
                    Vue d'ensemble
                </h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        Chargement des statistiques...
                    </div>
                </div>
            </div>

            <!-- Graphiques -->
            <div class="report-section">
                <h2 class="section-title">
                    <i class="fas fa-chart-pie"></i>
                    Répartition par département
                </h2>
                <div class="chart-container">
                    <canvas id="departmentChart"></canvas>
                </div>
            </div>

            <div class="report-section">
                <h2 class="section-title">
                    <i class="fas fa-chart-area"></i>
                    Évolution des recrutements
                </h2>
                <div class="chart-container">
                    <canvas id="recruitmentChart"></canvas>
                </div>
            </div>

            <!-- Graphiques supplémentaires -->
            <div class="chart-grid">
                <div class="report-section">
                    <h2 class="section-title">
                        <i class="fas fa-users"></i>
                        Types d'emploi
                    </h2>
                    <div class="chart-container">
                        <canvas id="employmentChart"></canvas>
                    </div>
                </div>

                <div class="report-section">
                    <h2 class="section-title">
                        <i class="fas fa-briefcase"></i>
                        Postes ouverts
                    </h2>
                    <div class="chart-container">
                        <canvas id="jobsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/hr-auth/hr-common.js"></script>
    <script>
        let departmentChart, recruitmentChart, employmentChart, jobsChart;

        // Palette de couleurs professionnelles
        const CHART_COLORS = {
            primary: '#1e40af',
            secondary: '#2563eb', 
            accent: '#3b82f6',
            success: '#059669',
            warning: '#d97706',
            error: '#dc2626',
            info: '#0891b2',
            purple: '#7c3aed',
            gradient: [
                '#1e40af', '#2563eb', '#3b82f6', '#059669', 
                '#d97706', '#dc2626', '#0891b2', '#7c3aed'
            ]
        };

        // Navigation
        function goBack() {
            window.history.back();
        }

        function exportReport() {
            // Simulation d'export
            alert('Fonctionnalité d\'export en cours de développement');
        }

        // Chargement des données
        async function loadReportsData() {
            try {
                // Charger les statistiques
                const statsResponse = await fetch('/api/dashboard-stats');
                const statsData = await statsResponse.json();

                if (statsData.success) {
                    displayStats(statsData.stats);
                }

                // Charger les données des départements
                const deptResponse = await fetch('/api/departments');
                const deptData = await deptResponse.json();

                if (deptData.success) {
                    createDepartmentChart(deptData.departments);
                }

                // Charger les données des employés
                const empResponse = await fetch('/api/employees');
                const empData = await empResponse.json();

                if (empData.success) {
                    createEmploymentChart(empData.employees);
                }

                // Charger les données des postes
                const jobsResponse = await fetch('/api/jobs');
                const jobsData = await jobsResponse.json();

                if (jobsData.success) {
                    createJobsChart(jobsData.jobs);
                }

                // Créer le graphique de recrutement (données simulées)
                createRecruitmentChart();

            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
                displayError();
            }
        }

        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="stat-number">${stats.total_departments}</div>
                    <div class="stat-label">Départements</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-number">${stats.total_employees}</div>
                    <div class="stat-label">Employés</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-briefcase"></i>
                    </div>
                    <div class="stat-number">${stats.total_jobs}</div>
                    <div class="stat-label">Postes ouverts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-number">${stats.urgent_jobs}</div>
                    <div class="stat-label">Postes urgents</div>
                </div>
            `;
        }

        function createDepartmentChart(departments) {
            const ctx = document.getElementById('departmentChart').getContext('2d');
            
            if (departments.length === 0) {
                ctx.canvas.parentElement.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-chart-pie"></i>
                        <p>Aucun département trouvé</p>
                    </div>
                `;
                return;
            }

            const labels = departments.map(dept => dept.name);
            const data = departments.map(dept => dept.employee_count);
            const colors = CHART_COLORS.gradient.slice(0, departments.length);

            departmentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 3,
                        borderColor: '#0f172a',
                        hoverBorderWidth: 4,
                        hoverBorderColor: '#f8fafc'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                color: '#f8fafc',
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#2563eb',
                            borderWidth: 1
                        }
                    }
                }
            });
        }

        function createEmploymentChart(employees) {
            const ctx = document.getElementById('employmentChart').getContext('2d');
            
            if (employees.length === 0) {
                ctx.canvas.parentElement.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-users"></i>
                        <p>Aucun employé trouvé</p>
                    </div>
                `;
                return;
            }

            // Compter les types d'emploi
            const employmentTypes = {};
            employees.forEach(emp => {
                const type = emp.employment_type || 'Non spécifié';
                employmentTypes[type] = (employmentTypes[type] || 0) + 1;
            });

            const labels = Object.keys(employmentTypes);
            const data = Object.values(employmentTypes);

            employmentChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Nombre d\'employés',
                        data: data,
                        backgroundColor: CHART_COLORS.primary,
                        borderColor: CHART_COLORS.secondary,
                        borderWidth: 2,
                        borderRadius: 8,
                        borderSkipped: false,
                        hoverBackgroundColor: CHART_COLORS.accent,
                        hoverBorderColor: CHART_COLORS.secondary
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#2563eb',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                color: '#cbd5e1',
                                font: {
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(203, 213, 225, 0.1)',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#cbd5e1',
                                font: {
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(203, 213, 225, 0.1)',
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }

        function createJobsChart(jobs) {
            const ctx = document.getElementById('jobsChart').getContext('2d');
            
            if (jobs.length === 0) {
                ctx.canvas.parentElement.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-briefcase"></i>
                        <p>Aucun poste trouvé</p>
                    </div>
                `;
                return;
            }

            // Compter les priorités
            const priorities = {};
            jobs.forEach(job => {
                const priority = job.priority || 'normal';
                priorities[priority] = (priorities[priority] || 0) + 1;
            });

            const labels = Object.keys(priorities);
            const data = Object.values(priorities);
            const colors = labels.map(label => {
                switch(label) {
                    case 'urgent': return CHART_COLORS.error;
                    case 'high': return CHART_COLORS.warning;
                    case 'normal': return CHART_COLORS.success;
                    case 'low': return CHART_COLORS.info;
                    default: return CHART_COLORS.primary;
                }
            });

            jobsChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 3,
                        borderColor: '#0f172a',
                        hoverBorderWidth: 4,
                        hoverBorderColor: '#f8fafc'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                color: '#f8fafc',
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#2563eb',
                            borderWidth: 1
                        }
                    }
                }
            });
        }

        function createRecruitmentChart() {
            const ctx = document.getElementById('recruitmentChart').getContext('2d');
            
            // Données simulées pour les 6 derniers mois
            const months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun'];
            const recruitments = [5, 8, 12, 6, 15, 10];

            recruitmentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Recrutements',
                        data: recruitments,
                        borderColor: CHART_COLORS.primary,
                        backgroundColor: `${CHART_COLORS.primary}20`,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: CHART_COLORS.primary,
                        pointBorderColor: '#f8fafc',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        pointHoverBackgroundColor: CHART_COLORS.accent,
                        pointHoverBorderColor: '#f8fafc'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#2563eb',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 2,
                                color: '#cbd5e1',
                                font: {
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(203, 213, 225, 0.1)',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#cbd5e1',
                                font: {
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(203, 213, 225, 0.1)',
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }

        function displayError() {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="no-data">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Erreur lors du chargement des données</p>
                </div>
            `;
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadReportsData();
        });
    </script>
</body>
</html>
