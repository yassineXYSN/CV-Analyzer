<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Employé - CV Analyzer Pro</title>
    <link rel="stylesheet" href="/static/employee-profile/employee-profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Header -->
    <header class="profile-header">
        <div class="header-content">
            <button class="back-btn" onclick="goBackToDashboard()">
                <i class="fas fa-arrow-left"></i> Retour au Dashboard
            </button>
            <h1><i class="fas fa-user"></i> Profil Employé</h1>
            <div class="header-actions">

            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="profile-container">
        <!-- Employee Overview -->
        <section class="profile-overview">
            <div class="employee-card">
                <div class="employee-avatar" id="employeeAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="employee-info">
                    <h2 id="employeeName">Chargement...</h2>
                    <p id="employeePosition">Position</p>
                    <div class="employee-meta">
                        <span id="employeeDepartment">Département</span>
                        <span id="employeeHireDate">Date d'embauche</span>
                    </div>
                </div>
                <div class="employee-status">
                    <div class="status-indicator active"></div>
                    <span>Actif</span>
                </div>
            </div>




        <!-- Main Grid -->
        <div class="profile-grid">
            <!-- Contact Information -->
            <section class="profile-section">
                <div class="section-header">
                    <h3><i class="fas fa-address-book"></i> Informations de Contact</h3>
                </div>
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <label>Email</label>
                            <span id="employeeEmail">email@example.com</span>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <label>Téléphone</label>
                            <span id="employeePhone">Non renseigné</span>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-building"></i>
                        <div>
                            <label>Bureau</label>
                            <span>Siège social</span>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-id-badge"></i>
                        <div>
                            <label>ID Employé</label>
                            <span id="employeeId">EMP001</span>
                        </div>
                    </div>
                </div>
            </section>
            <section class="profile-section">
                <div class="section-header">
                    <h3><i class="fas fa-user-edit"></i> Présentation du Profil</h3>
                </div>
                <p id="employeeProfileText" class="profile-paragraph"></p>
            </section>
            <!-- Documents -->
            <section class="profile-section">
                <div class="section-header">
                    <h3><i class="fas fa-file-alt"></i> Documents</h3>
                        <i class="fas fa-upload"></i> Ajouter
                    </button>
                </div>
                <div class="documents-list">
                   <div class="notes-list" id="notesList"></div>

                    
                </div>
            </section>
           <!-- Éducation -->
                <section class="profile-section">
                    <div class="section-header">
                        <h3><i class="fas fa-graduation-cap"></i> Éducation</h3>
                    </div>
                    <ul id="employeeEducationList" class="info-list"></ul>
                </section>

                <!-- Langues -->
                <section class="profile-section">
                    <div class="section-header">
                        <h3><i class="fas fa-language"></i> Langues</h3>
                    </div>
                    <ul id="employeeLanguagesList" class="info-list"></ul>
                </section>

                <!-- Certificats -->
                <section class="profile-section">
                    <div class="section-header">
                        <h3><i class="fas fa-certificate"></i> Certificats</h3>
                    </div>
                    <ul id="employeeCertificatesList" class="info-list"></ul>
                </section>
            <!-- Skills -->
            <section class="profile-section">
                <div class="section-header">
                    <h3><i class="fas fa-cogs"></i> Compétences</h3>
                </div>
                <div class="skills-list" id="employeeSkillsList"></div>
            </section>
            

            

            
        </div>
    </div>

    <!-- Modal Add Note -->
    <div id="noteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-sticky-note"></i> Ajouter une Note</h3>
                <button class="modal-close" onclick="closeNoteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="noteForm">
                    <div class="form-group">
                        <label class="form-label">Note</label>
                        <textarea id="noteContent" class="form-textarea" placeholder="Saisissez votre note..." required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeNoteModal()">Annuler</button>
                <button class="btn-primary" onclick="saveNote()">
                    <i class="fas fa-save"></i> Sauvegarder
                </button>
            </div>
        </div>
    </div>

    <script src="/static/hr-auth/hr-common.js"></script>
    <script src="/static/employee-profile/employee-profile.js"></script>
</body>
</html>
