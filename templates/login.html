<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CV Analyzer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap");

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-gradient: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            --danger-gradient: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            --warning-gradient: linear-gradient(135deg, #ffa502 0%, #ff6348 100%);
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif !important;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 50%, #0f0f23 100%) !important;
            min-height: 100vh !important;
            color: var(--text-primary) !important;
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Background Effects */
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.1));
            animation: float 20s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 10%;
            animation-delay: -7s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 20%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            33% {
                transform: translateY(-30px) rotate(120deg);
                opacity: 0.6;
            }
            66% {
                transform: translateY(30px) rotate(240deg);
                opacity: 0.4;
            }
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem !important;
            font-weight: 800 !important;
            background: var(--accent-gradient) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            margin-bottom: 0.5rem;
        }

        .logo-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* Login Form */
        .login-form {
            background: var(--card-bg) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 24px !important;
            padding: 3rem !important;
            position: relative;
            overflow: hidden;
        }

        .login-form::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-gradient);
        }

        .form-title {
            font-size: 1.8rem !important;
            font-weight: 700 !important;
            text-align: center !important;
            margin-bottom: 2rem !important;
            color: var(--text-primary) !important;
        }

        .form-group {
            margin-bottom: 1.5rem !important;
        }

        .form-label {
            display: block !important;
            font-weight: 600 !important;
            margin-bottom: 0.75rem !important;
            color: var(--text-primary) !important;
            font-size: 0.9rem !important;
        }

        .form-input {
            width: 100% !important;
            padding: 1rem 1.5rem !important;
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 1rem !important;
            transition: all 0.3s ease !important;
            font-family: inherit !important;
        }

        .form-input:focus {
            outline: none !important;
            border-color: #00d4ff !important;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1) !important;
            background: rgba(0, 0, 0, 0.4) !important;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* Password Input Container */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* Remember Me & Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d4ff;
        }

        .checkbox-container label {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-password {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #00ff88;
        }

        /* Submit Button */
        .submit-btn {
            width: 100% !important;
            padding: 1.25rem !important;
            background: var(--accent-gradient) !important;
            border: none !important;
            border-radius: 12px !important;
            color: #000 !important;
            font-weight: 700 !important;
            font-size: 1.1rem !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3) !important;
        }

        .submit-btn:active {
            transform: translateY(0) !important;
        }

        .submit-btn.loading {
            opacity: 0.8 !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }

        .divider span {
            background: var(--card-bg);
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .social-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .social-btn.google:hover {
            border-color: rgba(234, 67, 53, 0.5);
        }

        .social-btn.linkedin:hover {
            border-color: rgba(0, 119, 181, 0.5);
        }

        /* Sign Up Link */
        .signup-link {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #00ff88;
        }

        /* Loading Animation */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error Message */
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Success Message */
        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .login-form {
                padding: 2rem !important;
            }
            
            .logo {
                font-size: 1.5rem !important;
            }
            
            .form-title {
                font-size: 1.5rem !important;
            }
            
            .social-login {
                flex-direction: column;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gradient);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00b8e6, #00e67a);
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">CV Analyzer Pro</div>
            <div class="logo-subtitle">Analyse intelligente de CV propulsée par l'IA</div>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <h2 class="form-title">🔐 Connexion</h2>
            
            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                ❌ Identifiants incorrects. Veuillez réessayer.
            </div>
            
            <!-- Success Message -->
            <div class="success-message" id="successMessage">
                ✅ Connexion réussie ! Redirection en cours...
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">📧 Adresse e-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="votre@email.com"
                    required
                >
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">🔒 Mot de passe</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Votre mot de passe"
                        required
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        👁️
                    </button>
                </div>
            </div>

            <!-- Form Options -->
            <div class="form-options">
                <div class="checkbox-container">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>
                <a href="#" class="forgot-password">Mot de passe oublié ?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitText">🚀 Se connecter</span>
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>ou continuer avec</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="social-btn google" id="googleLogin">
                    <span>🔴</span>
                    Google
                </button>
                <button type="button" class="social-btn linkedin" id="linkedinLogin">
                    <span>💼</span>
                    LinkedIn
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link">
                Pas encore de compte ? <a href="#">Créer un compte</a>
            </div>
        </form>
    </div>

    <script>
        // Password toggle functionality
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Form submission
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Show loading state
            submitBtn.classList.add('loading');
            submitText.innerHTML = '<span class="loading-spinner"></span> Connexion...';
            submitBtn.disabled = true;

            // Get form data
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Simulate login process
            setTimeout(() => {
                // Demo: Simple validation (replace with real authentication)
                if (email === 'demo@cvanalyzer.com' && password === 'demo123') {
                    // Success
                    successMessage.style.display = 'block';
                    submitText.innerHTML = '✅ Connexion réussie !';
                    
                    // Redirect after success
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // Replace with actual dashboard URL
                    }, 2000);
                } else {
                    // Error
                    errorMessage.style.display = 'block';
                    submitBtn.classList.remove('loading');
                    submitText.innerHTML = '🚀 Se connecter';
                    submitBtn.disabled = false;
                }
            }, 2000);
        });

        // Social login handlers
        document.getElementById('googleLogin').addEventListener('click', function() {
            alert('Connexion Google - Fonctionnalité à implémenter');
        });

        document.getElementById('linkedinLogin').addEventListener('click', function() {
            alert('Connexion LinkedIn - Fonctionnalité à implémenter');
        });

        // Input focus effects
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        // Demo credentials hint
        setTimeout(() => {
            const hint = document.createElement('div');
            hint.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(0, 212, 255, 0.1);
                border: 1px solid rgba(0, 212, 255, 0.3);
                color: #00d4ff;
                padding: 1rem;
                border-radius: 8px;
                font-size: 0.8rem;
                z-index: 1000;
                max-width: 250px;
            `;
            hint.innerHTML = `
                <strong>💡 Demo</strong><br>
                Email: demo@cvanalyzer.com<br>
                Mot de passe: demo123
            `;
            document.body.appendChild(hint);
            
            // Auto-hide after 10 seconds
            setTimeout(() => {
                hint.style.opacity = '0';
                hint.style.transition = 'opacity 0.5s ease';
                setTimeout(() => hint.remove(), 500);
            }, 10000);
        }, 3000);
    </script>
</body>
</html>
