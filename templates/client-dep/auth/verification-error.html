<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur de Vérification - CV Analyzer Pro</title>
    <link rel="stylesheet" href="/static/client-dep/css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container error-layout">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle fa-4x"></i>
            </div>
            <h1>Erreur de vérification</h1>
            <p>{{ error }}</p>
            
            <div class="error-actions">
                <a href="/auth/email-verification" class="retry-btn">
                    <i class="fas fa-redo"></i>
                    Renvoyer l'email de vérification
                </a>
                <a href="/login" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <style>
        .error-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-content {
            max-width: 500px;
            padding: 3rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .error-icon {
            color: #ef4444;
            margin-bottom: 2rem;
        }

        .error-content h1 {
            color: #1e293b;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .error-content p {
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .retry-btn, .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .retry-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .login-btn {
            background: #f1f5f9;
            color: #64748b;
        }

        .login-btn:hover {
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</body>
</html>
