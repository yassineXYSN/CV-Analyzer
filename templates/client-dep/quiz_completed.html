<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Déjà Terminé - {{ quiz.title }}</title>
    <link rel="stylesheet" href="/static/client-dep/css/analyze.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .quiz-completed-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .quiz-completed-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        
        .quiz-status-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }
        
        .quiz-status-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .quiz-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .quiz-message {
            font-size: 1.125rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .quiz-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        .action-btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            min-width: 200px;
        }
        
        .action-btn.primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-md);
        }
        
        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .action-btn.secondary {
            background: var(--background);
            color: var(--text-secondary);
            border: 2px solid var(--border);
        }
        
        .action-btn.secondary:hover {
            background: var(--surface);
            border-color: var(--primary-300);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .quiz-completed-container {
                padding: 1rem;
            }
            
            .quiz-completed-card {
                padding: 2rem 1.5rem;
            }
            
            .quiz-title {
                font-size: 1.5rem;
            }
            
            .quiz-actions {
                gap: 0.75rem;
            }
            
            .action-btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <div class="grid-overlay"></div>
    </div>

    <div class="main-container">
        <div class="quiz-completed-container">
            <div class="quiz-completed-card">
                <div class="quiz-status-icon">⚠️</div>
                <div class="quiz-status-badge">Quiz Déjà Terminé</div>
                <h1 class="quiz-title">{{ quiz.title }}</h1>
                <p class="quiz-message">{{ message }}</p>
                
                <div class="quiz-actions">
                    {% if attempt.status == 'completed' %}
                    <a href="/quiz/{{ quiz.id }}/results" class="action-btn primary">
                        📊 Voir mes résultats
                    </a>
                    {% endif %}
                    
                    <a href="/" class="action-btn secondary">
                        🏠 Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
